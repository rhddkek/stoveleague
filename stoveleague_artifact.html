<title>스토브리그</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 레이아웃: 모바일 세로 단일 컬럼(최대 560px), 상단 구단 바 + 하단 5탭. 결정(주황) → 성장(초록) → 진행(네이비) 순 */
:root{
  --navy:#13254a;--navy2:#1d3462;--navy3:#2a4680;--on-navy:#ffffff;--on-navy-dim:#b9c3da;
  --bg:#f2eee5;--card:#ffffff;--sunk:#ebe6da;--text:#18213a;--muted:#4f5869;--line:#ddd6c7;
  --green:#1f8a55;--green-bg:#e3f4ea;--green-ink:#17704a;
  --orange:#d9711c;--orange-bg:#fdeedd;--orange-ink:#a8520c;
  --red:#cc3f36;--red-bg:#fbe5e3;--red-ink:#a92f27;
  --gold:#c9970f;--blue:#3a6fd8;--gray:#8b909b;
  --f-display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1626;--card:#18223a;--sunk:#202c48;--text:#e9e6de;--muted:#a2abc0;--line:#2c3a5a;
  --green-bg:#16362a;--green-ink:#63d39c;--orange-bg:#3a2a16;--orange-ink:#f3a55e;--red-bg:#3c1d1d;--red-ink:#f08a82;
  --navy2:#223b6d;--navy3:#3053a0;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1626;--card:#18223a;--sunk:#202c48;--text:#e9e6de;--muted:#a2abc0;--line:#2c3a5a;
  --green-bg:#16362a;--green-ink:#63d39c;--orange-bg:#3a2a16;--orange-ink:#f3a55e;--red-bg:#3c1d1d;--red-ink:#f08a82;
  --navy2:#223b6d;--navy3:#3053a0;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--navy);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy)}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.num,.big,table,.stat3 .v{font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:15px;cursor:pointer;border:none;border-radius:12px;padding:12px 14px;background:var(--sunk);color:var(--text);min-height:44px;font-weight:600}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button.primary{background:var(--navy);color:var(--on-navy)}
:root[data-theme="dark"] button.primary{background:var(--navy3)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) button.primary{background:var(--navy3)}}
button.go{background:var(--green);color:#fff}
button.warn{background:var(--orange);color:#fff}
button.danger{background:var(--red);color:#fff}
button.ghost{background:transparent;border:1.5px solid var(--line);color:var(--text)}
button.big{font-size:17px;padding:15px;width:100%}
button.sm{min-height:34px;padding:6px 11px;font-size:13px;border-radius:9px}
button:disabled{opacity:.4;cursor:default}
select,input,textarea{font-family:inherit;font-size:15px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);min-height:44px;max-width:100%}
input[type=number]{width:100%}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.content{flex:1;padding-block:12px 96px}

/* 상단 구단 바 */
.club{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--navy);color:var(--on-navy);padding-block:10px 10px}
.club .r1{display:flex;align-items:center;gap:10px}
.club .nm{font-family:var(--f-display);font-size:21px;line-height:1.1;letter-spacing:.01em}
.club .sub{font-size:12px;color:var(--on-navy-dim)}
.cashpill{margin-left:auto;background:var(--navy2);border:1px solid var(--navy3);border-radius:12px;padding:6px 12px;font-family:var(--f-display);font-size:18px;color:#a9e6c4;white-space:nowrap}
.cashpill.neg{color:#ffb1a9}
.club .r2{display:flex;margin-top:8px;background:var(--navy2);border-radius:10px;font-size:13px}
.club .r2>*{flex:1;text-align:center;padding:7px 4px;border-right:1px solid var(--navy3);color:var(--on-navy)}
.club .r2>*:last-child{border-right:none}
.club .r2 button{background:transparent;min-height:0;padding:7px 4px;border-radius:0;font-size:13px;font-weight:500;color:var(--on-navy-dim)}

/* 하단 메뉴 */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--navy);z-index:6;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav .in{display:flex;max-width:560px;margin:0 auto}
.nav button{flex:1;background:transparent;color:var(--on-navy-dim);border-radius:0;padding:8px 2px;font-size:12px;font-weight:500;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.nav button svg{width:22px;height:22px}
.nav button.on{color:#fff;background:var(--navy2);font-weight:700}
.nav .dot{position:absolute;margin-left:18px;margin-top:-4px;width:8px;height:8px;border-radius:50%;background:var(--orange)}

/* 카드 */
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.card.flat{border:none;background:transparent;padding:0}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 10px}
.hd h3{margin:0;font-size:17px;font-weight:700;text-wrap:balance}
.hd small{color:var(--muted);font-size:12px}
.muted{color:var(--muted);font-size:13.5px}.small{font-size:13px}.b{font-weight:700}
.row{display:flex;align-items:center;gap:8px}.sb{justify-content:space-between}.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* 등급 */
.grade{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:7px;color:#fff;font-weight:800;font-size:14px;flex-shrink:0;font-family:var(--f-body)}
.grade.S{background:var(--gold)}.grade.A{background:var(--red)}.grade.B{background:var(--blue)}.grade.C{background:var(--green)}.grade.D{background:var(--gray)}

/* 칩 */
.chip{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.g{background:var(--green-bg);color:var(--green-ink)}.chip.o{background:var(--orange-bg);color:var(--orange-ink)}.chip.r{background:var(--red-bg);color:var(--red-ink)}.chip.n{background:var(--navy);color:#fff}
.up{color:var(--green-ink);font-weight:700}.dn{color:var(--red-ink);font-weight:700}.ok{color:var(--green-ink)}.bad{color:var(--red-ink)}.due{color:var(--orange-ink)}

/* 결정 카드 */
.decide{background:var(--orange-bg);border:1.5px solid color-mix(in srgb,var(--orange) 45%,transparent);border-radius:14px;padding:14px;margin-bottom:12px}
.decide .tagline{display:inline-block;background:var(--orange);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:7px;margin-bottom:6px}
.decide .ttl{font-size:19px;font-weight:800;line-height:1.25}
.decide .amt{font-family:var(--f-display);font-size:24px;line-height:1.1}
.decide .grid{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
@media(max-width:380px){.decide .grid{grid-template-columns:1fr}}

/* 육성 리포트 */
.rep{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.rep:first-of-type{border-top:none;padding-top:0}
.rep .who{font-size:14px}.rep .who b{font-size:15px}
.rep .jump{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:2px}
.rep .jump .n{font-family:var(--f-display);font-size:28px;line-height:1}
.rep .jump .n.to{color:var(--green-ink)}
.rep .jump .arr{color:var(--muted);font-size:18px}
.dpill{background:var(--green);color:#fff;border-radius:999px;padding:2px 10px;font-weight:800;font-size:14px}
.rep .val{font-size:13px;color:var(--muted)}.rep .val b{color:var(--text)}
.potbar{height:7px;background:var(--sunk);border-radius:4px;overflow:hidden;margin:7px 0 4px;position:relative}
.potbar i{position:absolute;inset:0 auto 0 0;background:var(--green);border-radius:4px}
.potbar s{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--green) 35%,transparent)}

/* 선수 행 */
.prow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer}
.prow:last-child{border-bottom:none}
.prow .nm{font-weight:700}.prow .sub{font-size:12px;color:var(--muted);margin-top:1px}
.prow .rt{margin-left:auto;text-align:right;font-size:13px;flex-shrink:0}
.prow .ovr{font-family:var(--f-display);font-size:20px;line-height:1}
.av{flex-shrink:0;border-radius:50%;display:block}

/* 탭 */
.subtabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto;padding-bottom:2px}
.subtabs button{background:var(--card);border:1px solid var(--line);white-space:nowrap;min-height:38px;padding:6px 13px;font-size:14px;font-weight:600}
.subtabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.seg{display:flex;background:var(--sunk);border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;background:transparent;min-height:40px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--navy);color:#fff}

/* 표 */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600;font-size:12px}
td:first-child,th:first-child{text-align:left}tr.me td{background:var(--green-bg);font-weight:700}

/* 선수 상세 */
.pv{flex:1;display:flex;flex-direction:column}
.pvbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding-block:8px}
.pvbar button{background:transparent;color:#fff;min-height:40px;padding:6px 8px;font-size:22px;line-height:1}
.pvbar .t{font-size:17px;font-weight:700}
.phero{display:grid;grid-template-columns:88px 1fr;gap:12px;align-items:center;margin-bottom:12px}
.phero .nm{font-family:var(--f-display);font-size:26px;line-height:1.1;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat3>div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 6px;text-align:center;min-width:0}
.stat3 .k{font-size:12px;color:var(--muted)}.stat3 .v{font-family:var(--f-display);font-size:24px;line-height:1.2}
.gban{background:var(--green-bg);border:1.5px solid color-mix(in srgb,var(--green) 40%,transparent);border-radius:14px;padding:10px 12px;display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;margin-bottom:12px}
.gban .l{font-weight:700;font-size:14px;color:var(--green-ink)}
.gban .k{font-size:11px;color:var(--muted);text-align:center}.gban .v{font-family:var(--f-display);font-size:20px;white-space:nowrap}
.gban .v em{font-style:normal;color:var(--green-ink)}
@media(max-width:400px){.gban{grid-template-columns:1fr 1fr}.gban .l{grid-column:1/-1}}
.attr{display:grid;grid-template-columns:48px 1fr 30px 46px;gap:8px;align-items:center;font-size:14px;padding:4px 0}
.attr .k{color:var(--muted)}.attr .v{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}.attr .d{font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.bar{height:9px;background:var(--sunk);border-radius:5px;overflow:hidden;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--green);border-radius:5px}
.bar s{position:absolute;inset:0 auto 0 0;background:color-mix(in srgb,var(--green) 30%,transparent);border-radius:5px}
.strip{display:grid;grid-template-columns:auto repeat(3,1fr);gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.strip .k{font-size:11px;color:var(--muted)}.strip .v{font-family:var(--f-display);font-size:20px}
.actbar{position:sticky;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:10px;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}

/* 협상 테이블 */
.table-top{background:var(--navy);color:#fff;padding-block:14px 16px;border-radius:0 0 22px 22px}
.seats{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;text-align:center}
.seats .nm{font-weight:700;font-size:15px}.seats .rl{font-size:12px;color:var(--on-navy-dim)}
.seats .vs{font-family:var(--f-display);font-size:18px;color:var(--on-navy-dim)}
.desk{height:12px;margin:12px 8px 0;border-radius:6px;background:linear-gradient(#6b4a2c,#4e341d)}
.mood{margin-top:12px;font-size:12px;color:var(--on-navy-dim)}
.mood .track{height:8px;background:var(--navy2);border-radius:4px;overflow:hidden;margin-top:4px}
.mood .track i{display:block;height:100%;border-radius:4px;transition:width .4s}
.chat{display:flex;flex-direction:column;gap:8px;padding-block:14px}
.bub{max-width:82%;padding:9px 12px;border-radius:14px;font-size:14px;line-height:1.4;animation:pop .25s ease-out}
.bub .who{display:block;font-size:11px;font-weight:700;opacity:.7;margin-bottom:2px}
.bub.them{background:var(--card);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.bub.club{background:var(--sunk);align-self:flex-start;border-bottom-left-radius:4px}
.bub.me{background:var(--navy);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.bub.sys{background:transparent;color:var(--muted);align-self:center;font-size:13px;font-style:italic;padding:2px}
@keyframes pop{from{transform:translateY(6px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.bub{animation:none}.mood .track i{transition:none}}
.offerform{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 18px rgba(0,0,0,.06)}
.offerform label{display:block;font-size:12px;color:var(--muted);margin:2px 0 4px}
.offerform .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.yrs{display:flex;gap:4px}.yrs button{flex:1;min-height:40px;padding:4px}.yrs button.on{background:var(--navy);color:#fff}
.stepper{display:grid;grid-template-columns:44px 1fr 44px;gap:4px}.stepper button{padding:4px;font-size:18px}
.stepper input{text-align:center;font-weight:700}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;margin:8px 0}
.toggle input{width:20px;height:20px;min-height:0}

/* 기타 */
.warnbox{background:var(--orange-bg);border-left:4px solid var(--orange);padding:10px 12px;border-radius:8px;margin-bottom:10px;font-size:14px}
.okbox{background:var(--green-bg);border-left:4px solid var(--green);padding:10px 12px;border-radius:8px;margin-bottom:10px;font-size:14px}
.badbox{background:var(--red-bg);border-left:4px solid var(--red);padding:10px 12px;border-radius:8px;margin-bottom:10px;font-size:14px}
.modal-bg{position:fixed;inset:0;background:rgba(8,16,34,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:700px){.modal-bg{align-items:center}}
.modal{background:var(--bg);color:var(--text);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){.modal{border-radius:18px}}
.modal .close{float:right;background:var(--sunk);min-height:36px;padding:6px 12px;border-radius:18px}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;z-index:30;font-size:14px;max-width:90%;box-shadow:0 4px 14px rgba(0,0,0,.3)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btns4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.btns4 button{padding:10px 4px;font-size:13px}
.slot{display:grid;grid-template-columns:22px 1fr 76px 64px;gap:6px;align-items:center;margin:5px 0}.slot select{min-height:40px;padding:6px;min-width:0}
.form label{display:block;font-size:13px;color:var(--muted);margin:8px 0 3px}

/* 경기 */
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:var(--navy);color:#fff;border-radius:14px;padding:12px;margin-bottom:12px}
.score .tn{font-size:13px;color:var(--on-navy-dim)}.score .sc{font-family:var(--f-display);font-size:40px;text-align:center;line-height:1.1}
.diamond{position:relative;width:70px;height:62px;margin:0 auto}.diamond i{position:absolute;width:18px;height:18px;background:rgba(255,255,255,.2);transform:rotate(45deg);border-radius:3px}
.diamond i.on{background:#4fd18e}.diamond .b1{right:4px;top:24px}.diamond .b2{left:26px;top:4px}.diamond .b3{left:4px;top:24px}
.count{display:flex;gap:12px;justify-content:center;font-size:14px}
.glog{max-height:200px;overflow-y:auto;font-size:13px}.glog div{padding:4px 0;border-bottom:1px dashed var(--line)}
.glog .hr{color:var(--red-ink);font-weight:700}.glog .inn{font-weight:700}.glog .\31 b,.glog .\32 b,.glog .\33 b,.glog .walk{color:var(--green-ink)}

/* 타이틀/튜토리얼 */
.title{min-height:100vh;background:var(--navy);color:#fff;padding-block:28px}
.title h1{font-family:var(--f-display);font-size:38px;margin:0;line-height:1.1;font-weight:400}
.title p{color:var(--on-navy-dim);margin:6px 0 20px}
.title .panel{background:var(--navy2);border-radius:16px;padding:14px;margin-bottom:12px}
.teamsel{display:grid;grid-template-columns:1fr 1fr;gap:8px}.teamsel button{background:var(--navy);color:#fff;text-align:left;padding:10px;border:2px solid transparent;display:flex;gap:8px;align-items:center;font-weight:600}
.teamsel button.on{border-color:#4fd18e}
.tut{position:fixed;inset:0;z-index:40;background:rgba(8,16,34,.7);display:flex;align-items:center;justify-content:center;padding:20px}
.tut .box{background:var(--card);color:var(--text);border-radius:16px;padding:20px;max-width:420px}

/* PC: 목록(좌) · 상세(우) */
.rp-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center;color:var(--muted);padding:24px}
@media(min-width:960px){
  #app{max-width:1240px}
  .split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:100vh}
  .lp{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
  .lp .content{flex:1}
  .split .nav{position:sticky;bottom:0}
  .split .nav .in{max-width:none}
  .rp{position:sticky;top:0;height:100vh;overflow-y:auto;min-width:0;background:var(--bg)}
  .rp .pvbar{top:0}
  .rp .actbar,.rp .offerform{padding-bottom:12px}
  .toast{bottom:84px}
}
th,td:first-child{white-space:nowrap}

/* 픽셀 아트 */
img.px{image-rendering:pixelated;image-rendering:crisp-edges}
img.av{border-radius:50%;object-fit:cover}
.field{position:relative;width:118px;height:118px;margin:0 auto;border-radius:10px;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.15)}
.field img{width:100%;height:100%;display:block}
.field i{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#ffd84d;border:2px solid #13254a;box-shadow:0 0 0 2px #fff;opacity:0;transform:scale(.4);transition:opacity .15s,transform .15s}
.field i.on{opacity:1;transform:scale(1)}
.field .r1{left:84.4%;top:55.5%}.field .r2{left:50%;top:23.4%}.field .r3{left:14.8%;top:55.5%}
@media (prefers-reduced-motion:reduce){.field i{transition:none}}
.ovseg{overflow-x:auto;scrollbar-width:none}.ovseg::-webkit-scrollbar{display:none}.ovseg button{flex:1 0 auto;padding:0 10px;white-space:nowrap}.ovseg .chip{font-size:10px;padding:1px 5px}
/* 홈: 이번 주 이야기 · 결정할 일 · 보고서 */
.story{display:flex;gap:14px;align-items:flex-start;background:var(--navy);color:#f6f1e4;border-radius:18px;padding:16px;margin-bottom:12px}
.story .sface img,.story .sface svg{border-radius:14px}
.story .tagline{color:#f3c76b}.story .ttl{font-size:18px;font-weight:800;line-height:1.35;margin:4px 0 6px}
.story .lines{font-size:15px;line-height:1.6;font-weight:600}.story .sub{font-size:13px;opacity:.85;margin-top:6px}.story .since{font-size:12px;opacity:.6;margin-top:4px}
.story .sbody{min-width:0;flex:1}.story button.ghost{color:#f6f1e4;border-color:#f6f1e455}
.dec .drow{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.dec .drow:last-of-type{border-bottom:none}
.dtag{font-size:11px;font-weight:700;color:var(--orange)}.dec .nm{font-weight:700}.dec .sub{font-size:12.5px;color:var(--muted)}
.report .v.small2,.stat3 .v.small2{font-size:16px}
.result .rline{padding:3px 0}.result.win{border-left:4px solid var(--green)}.result.loss{border-left:4px solid var(--red)}
.nrow{padding:6px 0;border-bottom:1px dashed var(--line)}.nrow.al::before{content:'● ';color:var(--green)}.nrow.os::before{content:'● ';color:var(--orange)}
.rp-home{padding-top:16px}
/* 작은 행사 카드 */
.cere{text-align:center;padding:4px 2px}.cere .ctag{display:inline-block;background:var(--tc,var(--navy));color:#fff;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:700}
.cere .cface{margin:12px auto 6px;display:flex;justify-content:center}.cere .cface img,.cere .cface svg{border-radius:20px;box-shadow:0 0 0 4px var(--tc,var(--navy))}
.cere .ctitle{font-size:18px;line-height:1.45;margin-bottom:4px}.cere .ctitle b{font-size:22px}
.cere .cbig{font-size:17px;font-weight:800;margin:6px 0}
.cere .cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left;margin:12px 0;background:var(--sunk);border-radius:12px;padding:12px}
.cere .cgrid .k{font-size:12px;color:var(--muted);margin-bottom:2px}
.cere .cquote{text-align:left;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--tc,var(--navy));border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.6}
@media (max-width:380px){.cere .cgrid{grid-template-columns:1fr}}
/* 시작 화면 */
.title{padding-block:0}
.title .hero{min-height:230px;background:var(--navy) center/cover no-repeat;image-rendering:pixelated;display:flex;align-items:flex-end;padding:28px 0 18px}
.title .hero h1{font-size:44px;text-shadow:0 2px 0 #0008}.title .hero p{color:#f6f1e4;margin:6px 0 0;text-shadow:0 1px 2px #000a}
.title .dim{color:var(--on-navy-dim)}
.contcard{background:var(--navy2);border:1px solid #ffffff22;border-radius:18px;padding:16px;margin:4px 0 12px}
.tbtns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}.tbtns button{background:var(--navy2);color:#fff;border:2px solid transparent}.tbtns button.on{border-color:#4fd18e}
.archsel{display:grid;grid-template-columns:1fr 1fr;gap:8px}.archsel button{background:var(--navy);color:#fff;text-align:left;padding:12px;border:2px solid transparent;border-radius:14px;display:block;min-height:0;font-weight:400}
.archsel button.on{border-color:#4fd18e;background:#1b2a5c}.atag{display:inline-block;font-size:11px;font-weight:700;color:#f3c76b;margin-top:2px}
.title details.adv{margin-top:12px}.title details.adv summary{cursor:pointer;color:var(--on-navy-dim);font-size:13px}
@media (max-width:560px){.archsel{grid-template-columns:1fr}}
/* 설정 */
.setrow{padding:10px 0;border-bottom:1px solid var(--line)}.setrow:last-child{border-bottom:none}.chk{width:22px;height:22px;min-height:0}
.title .setrow{border-color:#ffffff1a}
html.fz-l{font-size:17.5px}html.fz-xl{font-size:19.5px}
html.fz-l body{font-size:17.5px}html.fz-xl body{font-size:19.5px}
html.fz-l .small,html.fz-l .sub{font-size:14px!important}html.fz-xl .small,html.fz-xl .sub{font-size:15.5px!important}
html.calm *,html.calm *::before,html.calm *::after{animation:none!important;transition:none!important}
.story button.primary{background:#f3c76b;color:#14204a;border-color:#f3c76b}
/* 경기: 방금 일어난 일 */
.score .atk .tn{color:var(--orange);font-weight:800}.score .atk .tn::before{content:'▶ '}
.lastplay{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--gray);border-radius:14px;padding:12px 14px;margin:10px 0;animation:lp .35s ease-out}
.lastplay.good.ours,.lastplay.bad.theirs{border-left-color:var(--green)}.lastplay.bad.ours,.lastplay.good.theirs{border-left-color:var(--red)}
.lastplay .lpb{font-family:var(--f-display);font-size:28px;line-height:1.1}.lastplay .lpt{font-size:15px;margin-top:2px}
@keyframes lp{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
.cmpt th,.cmpt td{text-align:center;vertical-align:middle;padding:6px 8px}.cmpt th:first-child{white-space:nowrap}
.glist{display:grid;gap:8px;margin-top:12px;text-align:left}.gopt{display:block;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:0;font-weight:400;color:var(--ink,inherit)}
.gopt b{display:block;font-size:15px;margin-bottom:2px}.gopt span{font-size:13px;color:var(--muted)}.gopt:hover{border-color:var(--navy)}
/* 결정전 */
.postc{border-left:4px solid var(--orange)}
.postc .drow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.postc .drow:last-of-type{border-bottom:none}
.postc .drow .nm{font-weight:700;font-size:14px}.postc .drow.me{background:var(--green-bg);margin:0 -8px;padding:8px}
.chip.y{background:#f6e7b0;color:#7a5600;font-weight:700}
/* 스폰서 */
.spl{width:42px;height:42px;border-radius:10px;background:var(--navy);color:#f3c76b;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:0 0 auto}
.drow2{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.drow2:last-child{border-bottom:none}
/* 경기 화면 타자·투수 정보 */
.mu2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mu .mul{font-size:11.5px;line-height:1.45;margin-top:3px;word-break:keep-all}.mu .mul.b{font-weight:700;font-size:12px;margin-top:6px}
.stam{height:5px;border-radius:3px;background:var(--line);margin-top:3px;overflow:hidden}.mu .nw{white-space:nowrap}.stam i{display:block;height:100%}
/* 세부 지표 */
.advg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.adv{background:var(--bg2,rgba(0,0,0,.03));border:1px solid var(--line);border-radius:10px;padding:8px;min-width:0}
.adv .k{font-size:11.5px;color:var(--muted)}.adv .v{font-family:var(--f-display);font-size:20px;line-height:1.2}.adv .l{font-size:11px;color:var(--muted);line-height:1.35}.adv .chip{margin-top:4px;font-size:10.5px}
@media(min-width:700px){.advg{grid-template-columns:repeat(4,1fr)}}

}
function posPenalty(p,pos){

}
const POS_KO={C:'포수','1B':'1루수','2B':'2루수','3B':'3루수',SS:'유격수',LF:'좌익수',CF:'중견수',RF:'우익수',DH:'지명타자',SP:'선발투수',RP:'구원투수'};
function josa(w,a,b){w=String(w);const base=w.replace(/\s*\([^()]*\)\s*$/,'')||w;const ch=base.charAt(base.length-1);let code=ch.charCodeAt(0);const dig={'0':1,'1':8,'2':0,'3':16,'4':0,'5':0,'6':1,'7':8,'8':8,'9':0};let jong;
  if(code>=0xAC00&&code<=0xD7A3)jong=(code-0xAC00)%28;else if(dig[ch]!=null)jong=dig[ch];else if(/[a-zA-Z]/.test(ch))jong=/[lmnr]/i.test(ch)?(ch.toLowerCase()==='l'?8:4):0;else jong=0;

function posOvr(p,pos){
  const a=p.attrs,w=POS_W[pos]||POS_W.DH,pen=posPenalty(p,pos);

function genAge(){const r=rnd();return r<0.18?ri(18,21):r<0.5?ri(22,25):r<0.82?ri(26,30):ri(31,35);}

function baseVal(ovr){return BAL.VALUE_BASE*Math.pow(BAL.VALUE_STEP,(ovr-45)/10);}
function perfFactor(p){
  const s=p.hist.length?p.hist[p.hist.length-1].st:null;if(!s)return 1;
  if(isPitcher(p)){if(s.pOuts<30)return 1;const era=s.pER*27/s.pOuts;return clamp(1.15-(era-3.8)*0.06,0.85,1.15);}

function ops_(s){const ab=s.ab||1,h=s.h,bb=s.bb;const obp=(h+bb)/Math.max(1,s.ab+s.bb);const slg=(h+s.d2+2*s.d3+3*s.hr)/ab;return obp+slg;}

// ---------- 자동 편성 ----------
const LINEUP_POS=['C','SS','CF','2B','3B','RF','LF','1B','DH'];
const DEFW={C:1.3,SS:1.4,CF:1.3,'2B':1.2,'3B':1.0,RF:0.9,LF:0.8,'1B':0.6,DH:0};
function offVal(p){const a=p.attrs;return a.contact*.36+a.power*.34+a.eye*.18+a.speed*.12;}
function defAt(p,pos){const pen=posPenalty(p,pos);return {d:clamp(p.attrs.defense-pen,10,99),ar:clamp(p.attrs.arm-pen*0.5,10,99),pen};}
function fitScore(p,pos,opt){
  let s=offVal(p);if(pos!=='DH'){const x=defAt(p,pos);s+=DEFW[pos]*((x.d-50)*0.55+(x.ar-50)*0.15);if(x.pen>=12)s-=3;}else if(p.pos!=='DH')s-=1.5;
  if(opt){if(opt.mode==='youth'&&p.age<=24)s+=Math.max(0,Math.min(25,(p.scout?p.scout.est:p.pot)-calcOvr(p)))*0.45+3;
    if(opt.mode==='rest'&&(p.fatigue||0)>50)s-=((p.fatigue||0)-50)*0.5;if((p.fatigue||0)>85)s-=10;}
  return s;}
function bestLineup(bats,opt){
  opt=opt||{};const locks=opt.locks||{};const pool=bats.filter(p=>p&&!p.retired);const asg={};const used=new Set();
  for(const pid in locks){const p=pool.find(x=>x.id===+pid);if(p&&!used.has(p.id)&&!Object.values(asg).includes(locks[pid])){asg[p.id]=locks[pid];used.add(p.id);}}
  const lockedIds=new Set(Object.keys(asg).map(Number));
  for(const pos of LINEUP_POS){if(Object.values(asg).includes(pos))continue;let best=null,bv=-1e9;for(const p of pool){if(used.has(p.id))continue;const v=fitScore(p,pos,opt);if(v>bv){bv=v;best=p;}}if(best){asg[best.id]=pos;used.add(best.id);}}
  const total=()=>{let t=0;for(const id in asg)t+=fitScore(pool.find(x=>x.id===+id),asg[id],opt);return t;};
  for(let it=0;it<40;it++){let bestGain=0.01,act=null;const ids=Object.keys(asg).map(Number).filter(id=>!lockedIds.has(id));
    for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){const a=pool.find(x=>x.id===ids[i]),b=pool.find(x=>x.id===ids[j]);const pa=asg[a.id],pb=asg[b.id];const g=fitScore(a,pb,opt)+fitScore(b,pa,opt)-fitScore(a,pa,opt)-fitScore(b,pb,opt);if(g>bestGain){bestGain=g;act=['swap',a.id,b.id];}}
    for(const id of ids){const a=pool.find(x=>x.id===id);const pos=asg[id];for(const b of pool){if(used.has(b.id))continue;const g=fitScore(b,pos,opt)-fitScore(a,pos,opt);if(g>bestGain){bestGain=g;act=['rep',id,b.id];}}}
    if(!act)break;if(act[0]==='swap'){const t=asg[act[1]];asg[act[1]]=asg[act[2]];asg[act[2]]=t;}else{const pos=asg[act[1]];delete asg[act[1]];used.delete(act[1]);asg[act[2]]=pos;used.add(act[2]);}}
  // 타순
  const chosen=Object.keys(asg).map(id=>pool.find(x=>x.id===+id));const rest=[...chosen].sort((a,b)=>offVal(b)-offVal(a));const order=new Array(chosen.length);
  const take=(fn,slot)=>{if(!rest.length)return;let bi=0,bv=-1e9;rest.slice(0,Math.min(rest.length,6)).forEach((p,i)=>{const v=fn(p);if(v>bv){bv=v;bi=i;}});order[slot]=rest.splice(bi,1)[0];};
  take(p=>p.attrs.power*.6+p.attrs.contact*.4,3);take(p=>offVal(p),2);take(p=>p.attrs.contact*.4+p.attrs.eye*.35+p.attrs.speed*.25,0);take(p=>p.attrs.contact*.6+p.attrs.speed*.2+p.attrs.eye*.2,1);

function autoLineup(t,opt){
  opt=opt||{mode:t.lineupMode||'win',locks:t.isUser?(t.locks||{}):{}};
  const ps=t.roster.map(id=>S.players[id]).filter(p=>p&&!p.retired);
  const bats=ps.filter(p=>!isPitcher(p)),pits=ps.filter(isPitcher);
  const r=bestLineup(bats,opt);t.lineup=r.order;t.pos=r.pos;
  const fat=p=>opt.mode==='rest'?(p.fatigue||0)*0.2:0;
  const sps=pits.filter(p=>p.pos==='SP').sort((a,b)=>calcOvr(b)-fat(b)-calcOvr(a)+fat(a));const rps=pits.filter(p=>p.pos==='RP').sort((a,b)=>calcOvr(b)-calcOvr(a));
  let rot=sps.slice(0,5).map(p=>p.id);const extra=[...sps.slice(5),...rps];
  while(rot.length<5&&extra.length)rot.push(extra.shift().id);
  t.rotation=rot;t.bullpen=pits.filter(p=>!rot.includes(p.id)).sort((a,b)=>calcOvr(b)-calcOvr(a)).map(p=>p.id);
  t.closer=t.bullpen.length?t.bullpen[0]:null;
  if(t.rotIdx>=t.rotation.length)t.rotIdx=0;
}
function teamPower(t,exclude){
  const ps=t.roster.filter(id=>id!==exclude).map(id=>S.players[id]).filter(p=>p&&!p.retired);
  const bats=ps.filter(p=>!isPitcher(p)),pits=ps.filter(isPitcher);const r=bestLineup(bats,{});
  let la=0,n=0;for(const id in r.pos){const p=S.players[id];la+=r.pos[id]==='DH'?offVal(p):posOvr(p,r.pos[id]);n++;}la=n?la/n:40;
  const byO=(a,b)=>calcOvr(b)-calcOvr(a);const spP=pits.filter(p=>p.pos==='SP').sort(byO).slice(0,5);if(spP.length<5)spP.push(...pits.filter(p=>p.pos!=='SP').sort(byO).slice(0,5-spP.length));
  const spAvg=spP.length?spP.reduce((s,p)=>s+calcOvr(p),0)/spP.length:40;const rpP=pits.filter(p=>!spP.includes(p)).sort(byO).slice(0,5);const rpAvg=rpP.length?rpP.reduce((s,p)=>s+calcOvr(p),0)/rpP.length:40;
  return {power:r1(la*0.55+spAvg*0.3+rpAvg*0.15),lineup:r,spIds:pits.filter(p=>p.pos==='SP').sort((a,b)=>calcOvr(b)-calcOvr(a)).slice(0,5).map(p=>p.id)};
}
// 유저 팀: 빠진 선수만 교체(기존 편성 유지)
function fixLineup(t){
  const alive=new Set(t.roster.filter(id=>S.players[id]&&!S.players[id].retired));
  const before=JSON.stringify([t.lineup,t.rotation,t.bullpen,t.closer]);
  t.lineup=t.lineup.filter(id=>alive.has(id));for(const id in t.pos)if(!alive.has(+id))delete t.pos[id];
  t.rotation=t.rotation.filter(id=>alive.has(id));t.bullpen=t.bullpen.filter(id=>alive.has(id));
  if(t.closer!=null&&!alive.has(t.closer))t.closer=null;
  const ps=[...alive].map(id=>S.players[id]);
  const needPos=['C','SS','2B','CF','3B','RF','LF','1B','DH'].filter(ps_=>!Object.values(t.pos).includes(ps_));
  for(const ps_ of needPos){let best=null,bv=-1e9;for(const p of ps){if(isPitcher(p)||t.lineup.includes(p.id))continue;const v=fitScore(p,ps_,{});if(v>bv){bv=v;best=p;}}if(best){t.lineup.push(best.id);t.pos[best.id]=ps_;}}
  if(t.locks)for(const id in t.locks)if(!alive.has(+id))delete t.locks[id];
  const pits=ps.filter(isPitcher);
  for(const p of pits)if(!t.rotation.includes(p.id)&&!t.bullpen.includes(p.id))t.bullpen.push(p.id);
  while(t.rotation.length<5&&t.bullpen.length){const sp=t.bullpen.find(id=>S.players[id].pos==='SP')||t.bullpen[0];t.bullpen=t.bullpen.filter(id=>id!==sp);t.rotation.push(sp);}
  if(t.closer==null&&t.bullpen.length)t.closer=[...t.bullpen].sort((a,b)=>calcOvr(S.players[b])-calcOvr(S.players[a]))[0];
  if(t.rotIdx>=t.rotation.length)t.rotIdx=0;
  return before!==JSON.stringify([t.lineup,t.rotation,t.bullpen,t.closer]);
}

// ===================== 코어 (B: 경기 엔진) =====================
function ensureBox(lg,pid){if(!lg.box[pid])lg.box[pid]={g:0,pa:0,ab:0,h:0,d2:0,d3:0,hr:0,bb:0,so:0,r:0,rbi:0,pG:0,pGS:0,pOuts:0,pH:0,pR:0,pER:0,pBB:0,pSO:0,pPit:0,pW:0,pL:0,pSV:0,pHR:0};return lg.box[pid];}
function effAttr(p,k){let v=p.attrs[k]+(p.cond||0)+((p.morale||60)-60)*0.04;const f=p.fatigue||0;if(f>70)v-=(f-70)*0.25;return clamp(v,10,99);}
function pitchLimit(p){return p.pos==='SP'?p.attrs.stamina*0.9+30:p.attrs.stamina*0.45+14;}
function pitEff(lg,p){const pc=lg.pc[p.id]||0;const over=Math.max(0,pc-pitchLimit(p));return clamp(1-over*0.006,0.6,1);}
function teamSide(lg,side){return S.teams[side===1?lg.home:lg.away];}
function teamDef(lg,side){let s=0,w=0;const wt={C:1.3,SS:1.4,'2B':1.2,CF:1.3,'3B':1,LF:0.8,RF:0.9,'1B':0.7};for(const pid of lg.lineup[side]){const pos=lg.pos[side][pid];if(!pos||pos==='DH')continue;const p=S.players[pid];const d=clamp(p.attrs.defense-posPenalty(p,pos),10,99);const k=wt[pos]||1;s+=d*k;w+=k;}return w?s/w:50;}

function createGame(homeId,awayId,userGame){
  const H=S.teams[homeId],A=S.teams[awayId];
  const lg={home:homeId,away:awayId,inn:1,half:0,outs:0,balls:0,strikes:0,bases:[null,null,null],score:[0,0],innScores:[[],[]],halfRuns:0,
    lineup:[[...A.lineup],[...H.lineup]],pos:[{...A.pos},{...H.pos}],bat:[0,0],pitcher:[null,null],used:[[],[]],subbed:[[],[]],pc:{},box:{},log:[],done:false,finalized:false,
    por:[null,null],lossP:null,leadSide:-1,entryLead:{},userGame:!!userGame,paCount:0,hits:[0,0],last:null};
  for(const side of [0,1]){const t=side===1?H:A;let sp=t.rotation.length?t.rotation[t.rotIdx%t.rotation.length]:null;
    if(sp==null||!S.players[sp]){sp=t.roster.map(id=>S.players[id]).filter(isPitcher)[0]?.id;}
    if(t.rotation.length)t.rotIdx=(t.rotIdx+1)%t.rotation.length;
    lg.pitcher[side]=sp;lg.used[side].push(sp);const b=ensureBox(lg,sp);b.pGS=1;b.pG=1;lg.entryLead[sp]=0;}
  for(const side of [0,1])for(const pid of lg.lineup[side]){const b=ensureBox(lg,pid);b.g=1;}
  glog(lg,`경기 시작: ${A.name} (원정) vs ${H.name} (홈)`,'info');
  return lg;
}
function glog(lg,text,type){lg.log.push({inn:lg.inn,half:lg.half,text,type:type||'n'});if(lg.log.length>400)lg.log.splice(0,lg.log.length-400);}
function curBatter(lg){return S.players[lg.lineup[lg.half][lg.bat[lg.half]]];}
function curPitcher(lg){return S.players[lg.pitcher[1-lg.half]];}

function scoreRun(lg,bs,runner,rbi,batterBox){
  lg.score[bs]++;lg.halfRuns++;
  const rb=ensureBox(lg,runner.pid);rb.r++;
  if(rbi&&batterBox)batterBox.rbi++;
  const pb=ensureBox(lg,runner.resp);pb.pR++;pb.pER++;
  const diff=lg.score[1]-lg.score[0];const ls=diff>0?1:diff<0?0:-1;
  if(ls!==lg.leadSide){if(ls!==-1){lg.por[ls]=lg.pitcher[ls];lg.lossP=lg.pitcher[1-ls];}lg.leadSide=ls;}
}
function addOut(lg,n){const pb=ensureBox(lg,lg.pitcher[1-lg.half]);lg.outs+=n;pb.pOuts+=n;}
function spd(pid){return S.players[pid]?effAttr(S.players[pid],'speed'):50;}
function fast(pid){const p=S.players[pid];return p&&p.traits.includes('빠른발')?8:0;}

function doPitch(lg){
  if(lg.done)return null;
  const bs=lg.half,fs=1-bs;
  const B=curBatter(lg),P=curPitcher(lg);
  const bb=ensureBox(lg,B.id),pb=ensureBox(lg,P.id);
  const eff=pitEff(lg,P);
  const ctl=effAttr(P,'control')*eff,stf=effAttr(P,'stuff')*eff,mov=effAttr(P,'movement')*eff;
  let con=effAttr(B,'contact'),pow=effAttr(B,'power'),eye=effAttr(B,'eye'),sp=effAttr(B,'speed');
  const risp=lg.bases[1]||lg.bases[2];
  if(risp&&B.traits.includes('클러치')){con+=4;pow+=4;}
  if(risp&&B.traits.includes('유리멘탈')){con-=3;eye-=3;}
  lg.pc[P.id]=(lg.pc[P.id]||0)+1;pb.pPit++;
  let zone=clamp(0.40+ctl*0.0032,0.45,0.78);if(lg.balls>=2)zone+=0.06;if(lg.strikes===2)zone-=0.07;if(lg.balls===3)zone+=0.05;
  const inZone=rnd()<zone;
  let swing;
  if(inZone)swing=0.62+(lg.strikes===2?0.25:0)-(lg.balls===3&&lg.strikes<2?0.2:0)+(lg.balls===0&&lg.strikes===0?-0.15:0);
  else swing=0.26-(eye-50)*0.0085+(lg.strikes===2?0.15:0)-(lg.balls===3?0.12:0)+(lg.balls===0&&lg.strikes===0?-0.1:0);  // 선구안: 볼에 덜 따라감 → 볼넷↑ 삼진↓
  swing=clamp(swing,0.05,0.95);
  let res;
  if(rnd()>=swing)res=inZone?'strike':'ball';
  else{let cp=clamp(0.76+(con-50)*0.0045-(stf-50)*0.004+(inZone?0.06:-0.14),0.3,0.95);if(rnd()>=cp)res='whiff';else res=rnd()<0.46?'foul':'inplay';}
  let ev={type:res,text:'',paEnd:false};lg.c0=[lg.balls,lg.strikes];
  const cnt=()=>`(${lg.balls}B-${lg.strikes}S)`;
  if(res==='ball'){lg.balls++;ev.text=`볼 ${cnt()}`;if(lg.balls===4){doWalk(lg,B,bb,pb);ev.type='walk';ev.text=`${B.name} 볼넷${lg.c0[1]===2?' (풀카운트 승부)':''}`;ev.paEnd=true;}}
  else if(res==='strike'||res==='whiff'){lg.strikes++;ev.text=(res==='whiff'?'헛스윙 ':'')+`스트라이크 ${cnt()}`;if(lg.strikes===3){bb.ab++;bb.so++;pb.pSO++;addOut(lg,1);ev.type='so';ev.text=`${B.name}, ${cntWord(lg)} ${res==='whiff'?'헛스윙':'루킹'} 삼진 아웃 (${lg.outs}아웃)`;ev.paEnd=true;}}
  else if(res==='foul'){if(lg.strikes<2)lg.strikes++;ev.text=`파울 ${cnt()}`;}
  else{ev=resolveInPlay(lg,B,P,bb,pb,con,pow,sp,stf,mov);ev.paEnd=true;}
  lg.last=ev;
  if(ev.paEnd)endPA(lg,ev);
  else glog(lg,ev.text,'p');
  return ev;
}
function doWalk(lg,B,bb,pb){
  bb.bb++;pb.pBB++;const b=lg.bases,P=lg.pitcher[1-lg.half];
  if(b[0]){if(b[1]){if(b[2])scoreRun(lg,lg.half,b[2],true,bb);b[2]=b[1];}b[1]=b[0];}
  b[0]={pid:B.id,resp:P};
}
function advRunners(lg,hitType,B,bb,def){
  const bs=lg.half,b=lg.bases,P=lg.pitcher[1-lg.half];const nb=[null,null,null];let runs=0;
  const score=(r)=>{scoreRun(lg,bs,r,true,bb);runs++;};
  if(hitType==='hr'){for(const r of [b[2],b[1],b[0]])if(r)score(r);score({pid:B.id,resp:P});}
  else if(hitType==='3b'){for(const r of [b[2],b[1],b[0]])if(r)score(r);nb[2]={pid:B.id,resp:P};}
  else if(hitType==='2b'){if(b[2])score(b[2]);if(b[1])score(b[1]);if(b[0]){if(rnd()<0.45+(spd(b[0].pid)+fast(b[0].pid)-50)*0.006-(def-50)*0.003)score(b[0]);else nb[2]=b[0];}nb[1]={pid:B.id,resp:P};}
  else{ // single
    if(b[2])score(b[2]);
    if(b[1]){if(rnd()<0.62+(spd(b[1].pid)+fast(b[1].pid)-50)*0.006-(def-50)*0.003)score(b[1]);else nb[2]=b[1];}
    if(b[0]){if(!nb[2]&&rnd()<0.28+(spd(b[0].pid)+fast(b[0].pid)-50)*0.005)nb[2]=b[0];else nb[1]=b[0];}
    nb[0]={pid:B.id,resp:P};
  }
  lg.bases=nb;return runs;
}
function resolveInPlay(lg,B,P,bb,pb,con,pow,sp,stf,mov){
  bb.ab++;const bs=lg.half,fs=1-bs;const def=teamDef(lg,fs);const before=lg.outs;
  let hrP=clamp(0.015+(pow-50)*0.0015-(stf-50)*0.0005-(mov-50)*0.0003,0.002,0.14);if(B.traits.includes('장타본능'))hrP*=1.25;
  const ev={type:'',text:'',paEnd:true};
  const ro=()=>lg.outs>0?` (${lg.outs}아웃)`:'';
  if(rnd()<hrP){bb.h++;bb.hr++;pb.pH++;pb.pHR++;const runs=advRunners(lg,'hr',B,bb,def);lg.hits[bs]++;ev.type='hr';const hd=playDir(lg,B);ev.text=`${B.name}, ${cntWord(lg)} ${hd.hr} ${runs===4?'만루':runs>1?runs+'점':'솔로'} 홈런! (비거리 ${Math.round(105+pow*0.3+hd.r*14)}m)`;return ev;}
  const hitP=clamp(0.34+(con-50)*0.003+(sp-50)*0.001-(def-50)*0.003-(mov-50)*0.0018,0.15,0.5);
  if(rnd()<hitP){
    bb.h++;pb.pH++;lg.hits[bs]++;
    const xb=clamp(0.17+(pow-50)*0.0035+(sp-50)*0.0012,0.05,0.45);const r=rnd();
    let type='1b';if(r<xb*0.1+Math.max(0,(sp-50))*0.0006)type='3b';else if(r<xb)type='2b';
    if(type==='3b'){bb.d3++;}else if(type==='2b'){bb.d2++;}
    const runs=advRunners(lg,type,B,bb,def);
    ev.type=type;const dd=playDir(lg,B);const inf=type==='1b'&&dd.r<0.12&&sp>=60;ev.text=`${B.name}, ${cntWord(lg)} ${inf?`${dd.inf} 깊은 곳 내야안타`:type==='3b'?dd.x3:type==='2b'?dd.x2:dd.x1}${runs?` (${runs}득점)`:''}`;return ev;
  }
  const gP=clamp(0.52+(mov-50)*0.003-(pow-50)*0.002,0.3,0.75);const b=lg.bases;
  if(rnd()<gP){
    if(before<2&&b[0]){
      const dp=clamp(0.36-(sp-50)*0.005-(spd(b[0].pid)-50)*0.002+(def-50)*0.003,0.08,0.7);
      if(rnd()<dp){addOut(lg,2);if(before===0){if(b[2])scoreRun(lg,bs,b[2],false,bb);lg.bases=[null,null,b[1]||null];}else lg.bases=[null,null,null];
        ev.type='dp';const d=playDir(lg,B);ev.text=`${B.name}, ${cntWord(lg)} ${d.dp} 병살타${ro()}`;return ev;}
    }
    {const ih=Math.max(0,sp-55)*0.0045+(B.traits.includes('빠른발')?0.03:0);if(ih>0&&rnd()<ih){bb.h++;pb.pH++;lg.hits[bs]++;const runs=advRunners(lg,'1b',B,bb,def);const d=playDir(lg,B);ev.type='1b';ev.text=`${B.name}, ${cntWord(lg)} ${d.inf} 쪽 땅볼 — 빠른 발로 내야안타${runs?` (${runs}득점)`:''}`;return ev;}}
    addOut(lg,1);ev.type='go';let extra='';
    if(before<2){const nb=[b[0],null,null];if(b[2]){if(rnd()<0.5){scoreRun(lg,bs,b[2],true,bb);extra=' (1득점)';}else nb[2]=b[2];}if(b[1]){if(!nb[2]&&rnd()<0.5)nb[2]=b[1];else nb[1]=b[1];}lg.bases=nb;}
    {const d=playDir(lg,B);ev.text=`${B.name}, ${cntWord(lg)} ${d.go} 땅볼 아웃 — ${d.goBy}${extra}${ro()}`;}return ev;
  }
  addOut(lg,1);ev.type='fo';let extra='';
  if(before<2){const nb=[b[0],b[1],null];if(b[2]){if(rnd()<0.65){scoreRun(lg,bs,b[2],true,bb);extra=' sf';}else nb[2]=b[2];}if(b[1]&&!nb[2]&&rnd()<0.22){nb[2]=b[1];nb[1]=null;}lg.bases=nb;}
  {const d=playDir(lg,B);ev.text=`${B.name}, ${cntWord(lg)} ${d.foW} ${extra?'희생플라이 (1득점)':'뜬공 아웃'} — ${d.foBy}${ro()}`;}return ev;
}
// 타구 방향·잡은 수비수·볼카운트 문구 (난수 대신 타석 번호로 정해 경기 결과·밸런스에 영향 없음)
function cntWord(lg){const c=lg.c0||[0,0];const [b,s]=c;if(!b&&!s)return '초구에';if(b===3&&s===2)return '풀카운트에서';return `${b}볼 ${s}스트라이크에서`;}
function hr01(lg,B,k){let x=(lg.paCount*2654435761+B.id*40503+lg.inn*97+k*7919+(lg.pc[lg.pitcher[1-lg.half]]||0)*131)>>>0;x^=x>>>15;x=Math.imul(x,2246822519)>>>0;x^=x>>>13;return (x%10000)/10000;}
function fielder(lg,pos){const fs=1-lg.half;if(pos==='P'){const p=S.players[lg.pitcher[fs]];return p?p.name:'';}const pid=lg.lineup[fs].find(id=>lg.pos[fs][id]===pos);return pid!=null&&S.players[pid]?S.players[pid].name:'';}
function playDir(lg,B){const P=S.players[lg.pitcher[1-lg.half]];const bats=B.bats==='S'?(P&&P.throws==='L'?'R':'L'):B.bats;const r=hr01(lg,B,1),r2=hr01(lg,B,2);
  const dir=r<0.45?'pull':r<0.75?'mid':'oppo';const side=dir==='mid'?'C':(dir==='pull')===(bats!=='L')?'L':'R';  // L=좌측(3루 쪽), R=우측(1루 쪽)
  const F=k=>{const n=fielder(lg,k);return n?`${KO_POS[k]} ${n}`:KO_POS[k];};
  const goPos=side==='L'?(r2<0.5?'3B':'SS'):side==='R'?(r2<0.5?'2B':'1B'):(r2<0.25?'P':r2<0.65?'SS':'2B');
  const foPos=r2<0.22?(side==='L'?'3B':side==='R'?'1B':'SS'):side==='L'?'LF':side==='R'?'RF':'CF';
  const out={r:hr01(lg,B,3)};
  out.go=`${KO_POS[goPos]} ${goPos==='P'?'앞':'쪽'}`;out.goBy=goPos==='1B'?`${F('1B')} 직접 처리`:`${F(goPos)} → 1루 송구`;
  out.foW=foPos.endsWith('F')?`${KO_POS[foPos]} ${r2<0.4?'앞':out.r>0.7?'펜스 앞까지 가는':'쪽'}`:`${KO_POS[foPos]} 쪽 내야`;out.foBy=`${F(foPos)} 포구`;
  out.dp=side==='L'?`${KO_POS[goPos==='3B'?'3B':'SS']} 땅볼 → 2루 → 1루로 이어지는`:side==='R'?'2루수 땅볼 → 유격수 → 1루로 이어지는':'유격수 땅볼 → 2루수 → 1루로 이어지는';
  out.inf=KO_POS[side==='R'?'2B':'SS'];
  out.x1=side==='L'?(r2<0.5?'3유간 빠지는 좌전 안타':'좌전 안타'):side==='R'?(r2<0.5?'1·2루간 빠지는 우전 안타':'우전 안타'):(r2<0.4?'투수 옆 빠지는 중전 안타':'중전 안타');
  out.x2=side==='L'?(r2<0.4?'좌익선상 2루타':'좌중간 가르는 2루타'):side==='R'?(r2<0.4?'우익선상 2루타':'우중간 가르는 2루타'):'중견수 키 넘기는 2루타';
  out.x3=side==='L'?'좌중간 깊숙한 3루타':side==='R'?(r2<0.5?'우익선상 3루타':'우중간 깊숙한 3루타'):'가운데 펜스 맞히는 3루타';
  out.hr=side==='L'?'좌측 담장 넘기는':side==='R'?'우측 담장 넘기는':'가운데 담장 넘기는';return out;}
const KO_POS={P:'투수',C:'포수','1B':'1루수','2B':'2루수','3B':'3루수',SS:'유격수',LF:'좌익수',CF:'중견수',RF:'우익수'};
function endPA(lg,ev){
  const bs=lg.half;const bb=ensureBox(lg,lg.lineup[bs][lg.bat[bs]]);bb.pa++;lg.paCount++;
  lg.balls=0;lg.strikes=0;lg.bat[bs]=(lg.bat[bs]+1)%lg.lineup[bs].length;
  glog(lg,ev.text,ev.type);
  if(lg.half===1&&lg.inn>=9&&lg.score[1]>lg.score[0]){finishGameState(lg,true);return;}
  if(lg.outs>=3){endHalf(lg);return;}
  aiPitchCheck(lg,1-bs,false);
}
function endHalf(lg){
  const bs=lg.half;lg.innScores[bs][lg.inn-1]=lg.halfRuns;lg.halfRuns=0;lg.outs=0;lg.bases=[null,null,null];lg.balls=0;lg.strikes=0;
  if(bs===0){if(lg.inn>=9&&lg.score[1]>lg.score[0]){finishGameState(lg,false);return;}lg.half=1;}
  else{if(lg.inn>=9&&lg.score[0]!==lg.score[1]){finishGameState(lg,false);return;}lg.inn++;lg.half=0;}
  glog(lg,`${lg.inn}회 ${lg.half===0?'초':'말'} — ${S.teams[lg.away].name} ${lg.score[0]} : ${lg.score[1]} ${S.teams[lg.home].name}`,'inn');
  aiPitchCheck(lg,1-lg.half,true);
}
function finishGameState(lg,walkoff){
  lg.done=true;const w=lg.score[1]>lg.score[0]?1:0;
  const wp=lg.por[w],lp=lg.lossP;if(wp!=null)ensureBox(lg,wp).pW=1;if(lp!=null)ensureBox(lg,lp).pL=1;
  const fp=lg.pitcher[w];if(fp!=null&&fp!==wp){const el=lg.entryLead[fp];if(el!=null&&el>0&&el<=3)ensureBox(lg,fp).pSV=1;}
  glog(lg,`경기 종료${walkoff?' (끝내기)':''}: ${S.teams[lg.away].name} ${lg.score[0]} : ${lg.score[1]} ${S.teams[lg.home].name}`,'end');
}
function availableBullpen(lg,side){const t=teamSide(lg,side);return t.bullpen.filter(id=>!lg.used[side].includes(id)&&S.players[id]&&!S.players[id].retired&&(S.players[id].fatigue||0)<78);}
function bench(lg,side){const t=teamSide(lg,side);return t.roster.filter(id=>{const p=S.players[id];return p&&!p.retired&&!isPitcher(p)&&!lg.lineup[side].includes(id)&&!lg.subbed[side].includes(id);});}
function changePitcher(lg,side,newPid){
  if(lg.done||lg.pitcher[side]===newPid)return false;
  const t=teamSide(lg,side);if(!t.roster.includes(newPid)||lg.used[side].includes(newPid))return false;
  const old=S.players[lg.pitcher[side]];const np=S.players[newPid];
  lg.pitcher[side]=newPid;lg.used[side].push(newPid);const b=ensureBox(lg,newPid);b.pG=1;lg.entryLead[newPid]=lg.score[side]-lg.score[1-side];
  glog(lg,`${t.name} 투수 교체: ${old?old.name:'?'} → ${np.name}`,'sub');return true;
}
function pinchHit(lg,side,benchPid){
  if(lg.done||lg.half!==side)return false;
  const t=teamSide(lg,side);if(!bench(lg,side).includes(benchPid))return false;
  const idx=lg.bat[side];const old=lg.lineup[side][idx];lg.lineup[side][idx]=benchPid;lg.pos[side][benchPid]=lg.pos[side][old];delete lg.pos[side][old];lg.subbed[side].push(old);
  const b=ensureBox(lg,benchPid);b.g=1;glog(lg,`${t.name} 대타: ${S.players[old].name} → ${S.players[benchPid].name}`,'sub');return true;
}
function aiPitchCheck(lg,side,halfStart){
  if(lg.done)return;const t=teamSide(lg,side);const P=S.players[lg.pitcher[side]];if(!P)return;
  const pc=lg.pc[P.id]||0,lim=pitchLimit(P),pb=ensureBox(lg,P.id);
  const lead=lg.score[side]-lg.score[1-side];const avail=availableBullpen(lg,side);if(!avail.length)return;
  const closer=t.closer!=null&&avail.includes(t.closer)?t.closer:null;
  const saveSpot=halfStart&&lg.inn>=9&&lead>0&&lead<=3&&closer!=null&&P.id!==closer;
  let need=false;
  if(pc>lim+12)need=true;else if(pc>lim&&(halfStart||lg.outs===0))need=true;
  else if(P.pos==='SP'&&pb.pR>=6&&lg.inn>=4)need=true;else if(P.pos==='RP'&&pb.pR>=3&&lg.outs<3)need=true;
  if(saveSpot&&(pc>lim*0.75||P.pos==='RP')){changePitcher(lg,side,closer);return;}
  if(!need)return;
  let pickId;if(lg.inn>=9&&lead>0&&lead<=3&&closer!=null)pickId=closer;else{const nonC=avail.filter(id=>id!==closer);const pool=nonC.length?nonC:avail;pool.sort((a,b)=>calcOvr(S.players[b])-calcOvr(S.players[a]));pickId=lg.inn>=7?pool[0]:pool[Math.min(pool.length-1,Math.floor(pool.length/2))];}
  changePitcher(lg,side,pickId);
}
// ---- 진행 단위 (모두 동일 엔진) ----
function stepPitch(lg){return doPitch(lg);}
function stepPA(lg){const c=lg.paCount;let ev=null;while(!lg.done&&lg.paCount===c)ev=doPitch(lg);return ev;}
function stepHalf(lg){const h=lg.inn*2+lg.half;let ev=null;while(!lg.done&&lg.inn*2+lg.half===h)ev=doPitch(lg);return ev;}
function stepGame(lg){let n=0;while(!lg.done&&n<20000){doPitch(lg);n++;}return lg.last;}
// ---- 기록 반영 (중복 방지) ----
function finalizeGame(lg){
  if(!lg.done||lg.finalized)return;lg.finalized=true;
  const H=S.teams[lg.home],A=S.teams[lg.away];
  const hw=lg.score[1]>lg.score[0];const sg=lg.gameRef!=null?S.schedule[lg.gameRef]:null;
  // 결정전(post)은 정규 시즌 순위 기록에 넣지 않는다
  if(!(sg&&sg.post)){H.rec[hw?'w':'l']++;A.rec[hw?'l':'w']++;H.rec.rs+=lg.score[1];H.rec.ra+=lg.score[0];A.rec.rs+=lg.score[0];A.rec.ra+=lg.score[1];}
  for(const pid in lg.box){const p=S.players[pid];if(!p)continue;const b=lg.box[pid];const c=p.cur;for(const k in b)c[k]=(c[k]||0)+b[k];
    if(b.pG){p.fatigue=Math.min(100,(p.fatigue||0)+b.pPit*0.55);p.xp+=b.pOuts;}
    else if(b.g){p.fatigue=Math.min(100,(p.fatigue||0)+5);p.xp+=b.pa;}
  }
  if(lg.gameRef!=null){const g=S.schedule[lg.gameRef];if(g&&!g.res)g.res={hs:lg.score[1],as:lg.score[0]};}
}

function registerPlayer(p){S.players[p.id]=p;return p;}
function genSchedule(){
  S.schedule=[];
  for(let div=1;div<=3;div++){
    const arr=divTeams(div).map(t=>t.id);const rounds=[];
    for(let r=0;r<7;r++){const pairs=[];for(let i=0;i<4;i++){const a=arr[i],b=arr[7-i];pairs.push(((r+i)%2===0)?[a,b]:[b,a]);}rounds.push(pairs);arr.splice(1,0,arr.pop());}
    for(let c=0;c<4;c++)for(let r=0;r<7;r++){const day=c*7+r+1;for(const [h,a] of rounds[r]){const flip=(c===1||c===2);S.schedule.push({day,div,home:flip?a:h,away:flip?h:a,res:null});}}
  }
  const pl=playLg();if(pl)genOverseasSchedule(pl);
  S.schedule.sort((a,b)=>a.day-b.day||String(a.div).localeCompare(String(b.div)));
}
function rrRounds(ids){const arr=ids.slice();if(arr.length%2)arr.push(null);const n=arr.length,R=n-1,half=n/2,rounds=[];
  for(let r=0;r<R;r++){const pairs=[];for(let i=0;i<half;i++){const a=arr[i],b=arr[n-1-i];if(a!=null&&b!=null)pairs.push(((r+i)%2===0)?[a,b]:[b,a]);}rounds.push(pairs);arr.splice(1,0,arr.pop());}return rounds;}
// 유저가 해외 구단을 맡은 경우의 압축 일정 (28경기). 양대 리그면 같은 리그 22경기 + 교류전 6경기
function genOverseasSchedule(pl){const G=BAL.SEASON_GAMES;const comps=leagueComps(pl);const groups=comps.map(c=>compTeams(c).map(t=>t.id));
  const push=(day,h,a)=>S.schedule.push({day,div:pl,home:h,away:a,res:null});
  const inter=groups.length===2&&groups[0].length===groups[1].length?groups[0].length:0;const interStart=Math.floor((G-inter)/2)+1;
  const intraDays=[];for(let d=1;d<=G;d++)if(!(inter&&d>=interStart&&d<interStart+inter))intraDays.push(d);
  for(const g of groups){const rounds=rrRounds(g);const R=rounds.length;intraDays.forEach((d,k)=>{const c=Math.floor(k/R),r=k%R;for(const [h,a] of rounds[r]){const flip=c%2===1;push(d,flip?a:h,flip?h:a);}});}
  if(inter){const [A,B]=groups,m=A.length;for(let r=0;r<m;r++){const d=interStart+r;for(let i=0;i<m;i++){const a=A[i],b=B[(i+r)%m];if((i+r)%2)push(d,a,b);else push(d,b,a);}}}}
function h2h(a,b){let w=0;for(const g of S.schedule){if(!g.res||g.post)continue;if(g.home===a&&g.away===b){if(g.res.hs>g.res.as)w++;}else if(g.home===b&&g.away===a){if(g.res.as>g.res.hs)w++;}}return w;}
function standings(div){const ts=compTeams(div);ts.sort((a,b)=>b.rec.w-a.rec.w||h2h(b.id,a.id)-h2h(a.id,b.id)||(b.rec.rs-b.rec.ra)-(a.rec.rs-a.rec.ra)||b.rec.rs-a.rec.rs||a.id-b.id);return ts;}

function payroll(t){let s=0;for(const pid of t.roster.concat(t.dev||[])){const p=P_(pid);if(p&&p.contract)s+=p.contract.salary*(p.loan&&p.loan.to===t.id?p.loan.pay:1);}
  for(const pid of (t.loaned||[])){const p=P_(pid);if(p&&p.contract&&p.loan&&p.loan.from===t.id)s+=p.contract.salary*(1-p.loan.pay);}return Math.round(s);}

function ticketIncome(t){const wp=(t.rec.w+t.rec.l)?t.rec.w/(t.rec.w+t.rec.l):0.5;return Math.round(econ(t).ticket*(0.7+t.rep/100*0.6)*presIncome(t)*(0.8+wp*0.4)*(0.9+rnd()*0.2));}

// ---------- 육성 ----------
function growthTick(p,ctx){
  if(!p||p.retired)return;const ovr0=calcOvr(p);const isP=isPitcher(p);const ovr=calcOvr(p);const peak=p.peakAge;const f=[];
  let expF;
  if(ctx.kind==='winter'){expF=0.7;f.push('국내 동계 훈련');}
  else if(ctx.kind==='rest'){expF=0.25;f.push('겨울 휴식 (성장 대신 회복)');}
  else if(ctx.kind==='dispatch'){const dd=ctx.dd;const lvlF=clamp(1+((BAL.LEVEL_OVR[dd.lg]||55)-ovr0)*0.02,0.8,1.25);expF=0.3+0.8*dd.share*lvlF;f.push(`${BAL.LEAGUES[dd.lg].name} 파견 (${dd.role})`);if(dd.share<0.35)f.push('파견지 출장 부족');else if(lvlF>1.05)f.push('수준 높은 실전 경험');}
  else if(ctx.dev){expF=BAL.DEV_EXP;f.push('육성군(2군) 경기 출장');}
  else{const target=isP?BAL.XP_TARGET_PIT:BAL.XP_TARGET_BAT;const ratio=(p.xp||0)/target;expF=0.4+0.6*Math.pow(Math.min(1,ratio),0.7);
    if(ratio>1.7){expF-=0.15;f.push('과도한 출장(피로)');}else if(ratio>=0.8)f.push('주전 출장');else if(p.resWeek&&expF<BAL.RES_EXP){expF=BAL.RES_EXP;f.push(ratio>=0.3?'1군 일부 출장 + 2군 경기':'2군 경기 출장');}else if(ratio>=0.3)f.push('일부 출장');else f.push('출장 기회 부족');
    if(ctx.team&&ctx.team.locks&&ctx.team.locks[p.id]&&p.age<=24){expF+=0.05;f.push('출장 보장(육성 약속)');}
    if(ratio<0.3&&p.age>=23&&p.age<peak)p.pot=Math.max(ovr,p.pot-0.25);}
  const fat=p.fatigue||0;if(fat>80){expF*=0.8;f.push('피로 누적');}
  const gap=p.pot-ovr;const gapF=clamp(gap/18,0,1.3);const a=p.age;
  let ageF=a<peak-1?1:a<=peak+1?0.45:0;if(a<=21)ageF*=1.15;
  const fac=ctx.team?ctx.team.fac.train:1;const facF=1+(fac-1)*0.12;if(fac>=2)f.push(`훈련장 Lv.${fac} 효과`);
  const fx=ctx.team&&ctx.team.staff?staffFx(ctx.team):null;let devM=1;if(fx&&(p.age<=23||ctx.dev)){devM=fx.dev*(staffTrait(ctx.team,'dev','u20')&&p.age<=20?1.08:1)*(ctx.dev&&staffTrait(ctx.team,'dev','devsq')?1.08:1);}
  let traitF=1;if(p.traits.includes('성실')){traitF+=0.3;f.push('성실한 태도');}if(p.traits.includes('게으름')){traitF-=0.3;f.push('훈련 태만');}
  const wint=ctx.kind==='winter'||ctx.kind==='dispatch'||ctx.kind==='rest';
  let pts=BAL.GROWTH_TICK*(wint?1.8:1)*expF*gapF*ageF*facF*traitF*devM*(0.7+rnd()*0.6);
  if(gap<=0.5&&ageF>0)pts=rnd()*0.25;
  const keys=isP?PIT_KEYS:BAT_KEYS;const focus=p.focus||'balance';const ch={};

function makeOverseasOffer(p){

  let fee=calcValue(p)*(1.5+rnd()*0.6)*LM[0];fee=Math.min(fee,t.cash*0.4);fee=Math.round(fee/100)*100;

function summaryStat(p,lg,share){const L=BAL.LEAGUES[lg]||{games:140};const g=L.games/140;const st=newStat();const a=p.attrs;const lv=(BAL.LEVEL_OVR[lg]||60)-60;

    st.pa=pa;st.bb=Math.round(pa*clamp(0.06+(a.eye-50)*0.0015,0.02,0.15));st.ab=pa-st.bb;st.h=Math.round(st.ab*avg);st.hr=Math.round(pa*clamp(0.008+(a.power-50)*0.0009-lv*0.0003,0.002,0.06));st.d2=Math.round(st.h*0.2);st.d3=Math.round(st.h*0.02);st.so=Math.round(pa*clamp(0.2-(a.contact-50)*0.0015+lv*0.002,0.08,0.38));st.g=Math.max(1,Math.round(pa/4.2));st.r=Math.round(st.h*0.5);st.rbi=Math.round(st.h*0.45+st.hr);}

function draftPick(pid,dest){const D=S.draft;if(!D||D.done)return {ok:false,msg:'진행 중인 드래프트가 없습니다.'};const t=S.teams[D.order[D.idx]];if(!t||!t.isUser)return {ok:false,msg:'우리 구단 차례가 아닙니다.'};
  if(pid==null){D.picks.push({team:t.id,pid:null,no:D.picks.length+1,pass:true});D.idx++;draftStep();return {ok:true,msg:'지명을 포기했습니다.'};}

function draftAuto(){const D=S.draft;if(!D||D.done)return;const t=userTeam();const avail=draftAvail();if(avail.length&&D.order[D.idx]===t.id){const need=needOf(t);avail.sort((a,b)=>(b.scout.est*0.7+calcOvr(b)*0.3+(need.includes(b.pos)?3:0))-(a.scout.est*0.7+calcOvr(a)*0.3+(need.includes(a.pos)?3:0)));draftPick(avail[0].id,'auto');}else draftPick(null);if(!D.done&&D.order[D.idx]===t.id)draftAuto();}

function alumniReport(s){const rows=Object.values(S.players).filter(p=>p.exUser&&!p.retired&&p.teamId!=null&&p.teamId!==S.userTeamId&&p.hist.length&&p.hist[p.hist.length-1].s===s);

// ---------- 리그 내 위상 ----------
function leagueKey(t){return t.league==='KR'?'KR'+t.div:t.league;}
function leagueTeams(key){return Object.values(S.teams).filter(t=>leagueKey(t)===key);}
function roleVal(p,pos){return isPitcher(p)?calcOvr(p):posOvr(p,pos||p.pos);}
const _lgCache={};
function leagueBase(key){const c=_lgCache[key];if(c&&c.clock===S.clock&&c.n===Object.keys(S.players).length)return c;const ts=leagueTeams(key);const bat={},pit={SP:[],RP:[]},all=[];
  for(const t of ts){for(const id of t.lineup){const x=P_(id);const pos=t.pos[id];if(!x||!pos)continue;const v=pos==='DH'?offVal(x)+5:posOvr(x,pos);(bat[pos]=bat[pos]||[]).push(v);all.push(v);}
    for(const id of t.rotation){const x=P_(id);if(x){pit.SP.push(calcOvr(x));all.push(calcOvr(x));}}for(const id of t.bullpen.slice(0,4)){const x=P_(id);if(x){pit.RP.push(calcOvr(x));all.push(calcOvr(x));}}}
  const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;const o={clock:S.clock,n:Object.keys(S.players).length,all:avg(all),pos:{}};
  for(const k in bat)o.pos[k]={avg:avg(bat[k]),n:bat[k].length};o.pos.SP={avg:avg(pit.SP),n:pit.SP.length};o.pos.RP={avg:avg(pit.RP),n:pit.RP.length};_lgCache[key]=o;return o;}
function leagueStanding(p,key){const b=leagueBase(key);if(b.all==null)return {label:'-',cls:''};const ps=b.pos[isPitcher(p)?p.pos:p.pos]||{avg:null,n:0};const K=8;
  const avg=ps.avg==null?b.all:(ps.avg*ps.n+b.all*K)/(ps.n+K);const v=roleVal(p);
  return v>=avg+6?{label:'리그 정상급',cls:'g',avg}:v>=avg-2?{label:'리그 주전급',cls:'g',avg}:v>=avg-8?{label:'리그 백업급',cls:'',avg}:{label:'리그 수준 미달',cls:'r',avg};}
function expectedRole(p,t){const mine=roleVal(p);const slots=isPitcher(p)?(p.pos==='SP'?5:4):1;
  const others=t.roster.map(P_).filter(x=>x&&x.id!==p.id&&!x.retired&&(isPitcher(p)?(p.pos==='SP'?x.pos==='SP':isPitcher(x)):x.pos===p.pos)).map(x=>roleVal(x,p.pos)).sort((a,b)=>b-a);
  const k=others.filter(v=>v>mine).length;
  if(k<slots){const c=others[slots-1];return c==null||mine>=c+3?'주전':'주전 경쟁';}
  const gap=others[slots-1]-mine;if(gap<=3)return '주전 경쟁';if(k<slots*2+1)return '백업';return '벤치';}
function standingAll(p){return ['KR1','KR2','KR3','JP','US','TW','MX','AU','CB'].map(k=>({key:k,name:k.startsWith('KR')?k[2]+'부':BAL.LEAGUES[k].name,lvl:k.startsWith('KR')?BAL.LEVEL_OVR[k]:BAL.LEVEL_OVR[k],...leagueStanding(p,k)}));}

// ---------- 겨울리그 파견 (비시즌 전용, 동계훈련 대체) ----------
function winterTeams(){return overseasTeams().filter(t=>BAL.LEAGUES[t.league].winter);}
function dispatchEligible(p){const ut=userTeam();if(!p||p.retired)return false;if(!ut.roster.includes(p.id)&&!ut.dev.includes(p.id))return false;
  return p.age<=BAL.DISPATCH.maxAge&&!S.pendingFA.includes(p.id)&&!(p.contract&&p.contract.years<=0)&&!S.market.listed.includes(p.id);}
function dispatchFee(t){return BAL.DISPATCH.fee[t.league]||400;}
function dispatchOptions(p){return winterTeams().map(t=>{const role=expectedRole(p,t);const share=BAL.DISPATCH.share[role];const lvlF=clamp(1+(BAL.LEVEL_OVR[t.league]-calcOvr(p))*0.02,0.8,1.25);const exp=0.3+0.8*share*lvlF;
  const mine=roleVal(p);const others=t.roster.map(P_).filter(x=>x&&x.id!==p.id&&!x.retired&&(isPitcher(p)?(p.pos==='SP'?x.pos==='SP':isPitcher(x)):x.pos===p.pos)).map(x=>roleVal(x,p.pos));const k=others.filter(v=>v>mine).length;const slots=isPitcher(p)?(p.pos==='SP'?5:4):1;
  const what=isPitcher(p)?(p.pos==='SP'?'선발 자원':'불펜 투수'):(POS_KO[p.pos]||p.pos);const why=`${what} ${others.length+1}명 중 ${k+1}번째 실력 (자리 ${slots}개)`;

  return {team:t,role,share,why,back,fee:dispatchFee(t),growth:exp>=0.82?'국내보다 높음':exp>=0.6?'국내와 비슷':'국내보다 낮음',gcls:exp>=0.82?'g':exp>=0.6?'':'r',need:needOf(t).includes(p.pos)};}).sort((a,b)=>b.share-a.share||a.fee-b.fee);}
function createDispatch(){createDispatchFor(userTeam());}
function createDispatchFor(ut){S.dispatch={s:S.season,phase:'open',reqs:[],list:[],declined:[]};

  if(S.dispatch.reqs.length)news(`겨울리그에서 파견 요청 ${S.dispatch.reqs.length}건이 왔습니다. 2주차까지 결정하세요.`,'sys');}
function dispatchPlayer(pid,teamId){const D=S.dispatch;const ut=userTeam();const p=P_(pid);const t=S.teams[teamId];
  if(!D||D.phase!=='open')return '파견 결정 기간(스토브리그 1~2주차)이 아닙니다.';if(!t||!BAL.LEAGUES[t.league]||!BAL.LEAGUES[t.league].winter)return '겨울리그 구단이 아닙니다.';

  if(D.list.length>=BAL.DISPATCH.max)return `한 시즌에 최대 ${BAL.DISPATCH.max}명까지 파견할 수 있습니다.`;const fee=dispatchFee(t);if(ut.cash<fee)return `파견비가 부족합니다 (${money(fee)}).`;

function cancelDispatch(pid){const D=S.dispatch;const p=P_(pid);if(!D||D.phase!=='open'||!p||!p.dispatch)return '취소할 수 없습니다.';const ut=userTeam();ut.cash+=p.dispatch.fee;ut.fin.dispatch=(ut.fin.dispatch||0)-p.dispatch.fee;D.list=D.list.filter(x=>x.pid!==pid);p.dispatch=null;return null;}
function declineDispatch(pid){const D=S.dispatch;if(!D)return;D.reqs=D.reqs.filter(r=>r.pid!==pid);if(!D.declined.includes(pid))D.declined.push(pid);}

  for(const x of D.list){const p=P_(x.pid);if(!p||!p.dispatch)continue;const t=S.teams[x.team];const base=BAL.DISPATCH.share[p.dispatch.role];const share=clamp(base*(0.8+rnd()*0.4),0.05,1);
    const st=summaryStat(p,t.league,share);p.winter=p.winter||[];p.winter.push({s:D.s,tn:t.name,lg:t.league,role:p.dispatch.role,share:r1(share),st});if(p.winter.length>8)p.winter.shift();
    p.dispatchDone={s:D.s,lg:t.league,role:p.dispatch.role,share};p.morale=clamp(p.morale+(share>=0.6?5:share<0.3?-6:0),0,100);
    const good=isPitcher(p)?(st.pOuts>=30&&st.pER*27/st.pOuts<3.6):(st.pa>=40&&ops_(st)>0.78);
    const line=isPitcher(p)?`${st.pW}승 ${st.pL}패 ERA ${st.pOuts?(st.pER*27/st.pOuts).toFixed(2):'-'}`:`타율 ${st.ab?(st.h/st.ab).toFixed(3).replace(/^0/,''):'-'} ${st.hr}홈런`;

// ---------- 감독 실적 (2단계 평판용) ----------
function mgrStart(){S.mgr=S.mgr||{seasons:[],cur:null};const ut=userTeam();const c=compOf(ut);const ts=compTeams(c).map(t=>({t,pw:teamPower(t).power})).sort((a,b)=>b.pw-a.pw);const er=ts.findIndex(x=>x.t.id===ut.id)+1;

// ---------- 감독 평판 · 이직 (2단계) ----------
// 구단 유형별 목표: 부임 후 첫 2시즌은 유형이 고른 운영 방식으로 평가 (유망주=육성, 재정난=흑자, 인기=높은 순위)
function archSeasons(t){return ((S.mgr&&S.mgr.seasons)||[]).filter(m=>m.team===t.id).length;}
function goalFor(t,r,n){const g=goalFor0(t,r,n);if(!t.isUser||!t.arch||t.league!=='KR')return g;const early=archSeasons(t)<2;
  if(t.arch==='popular'&&g.target>2){const tg=Math.max(2,g.target-2);return {text:`${tg}위 이내 (팬들의 기대)`,target:tg,kind:'rank'};}
  if(t.arch==='youth'&&early){const tg=Math.max(g.target,6);return {text:`육성 — 23세 이하 3명 종합 +5 이상 (${tg}위 이내)`,target:tg,kind:'youth',young:3};}
  if(t.arch==='poor'&&early){const tg=Math.max(g.target,5);return {text:`재정 — 시즌 말 현금 흑자 (${tg}위 이내)`,target:tg,kind:'cash'};}
  return g;}
// 목표 진행 상황 (홈·감독 탭 표시용)
function youngGrown(t){return t.roster.concat(t.dev).map(P_).filter(p=>{if(!p||p.age>23+(S.phase==='offseason'?1:0))return false;const B=growthBase(p);return B&&B.ovr!=null&&calcOvr(p)-B.ovr>=5;}).length;}
function goalCheck(goal,t,rank){if(!goal)return null;const pre=S.phase==='season'&&t.rec.w+t.rec.l===0;const parts=[pre?{ok:null,text:`개막 전 (목표 ${goal.target}위 이내)`}:{ok:rank<=goal.target,text:`${rank}위 (목표 ${goal.target}위 이내)`}];
  if(goal.kind==='youth'){const n=youngGrown(t);parts.push({ok:n>=goal.young,text:`육성 ${n}/${goal.young}명`});}
  if(goal.kind==='cash')parts.push({ok:t.cash>=0,text:`현금 ${money(t.cash)}`});
  return {met:parts.every(x=>x.ok===true),parts};}
function goalProgress(){const ut=userTeam();const g=S.mgr&&S.mgr.cur&&S.mgr.cur.goal;if(!g)return null;return goalCheck(g,ut,S.phase==='season'?rankOf(ut):(S.lastSummary?S.lastSummary.rank:rankOf(ut)));}
function goalFor0(t,r,n){if(r<=1)return {text:'우승',target:1};if(t.league==='KR'&&t.div>1&&r<=Math.ceil(n/2))return {text:'승격권 (2위 이내)',target:2};if(r<=Math.ceil(n/3))return {text:'상위 2위 이내',target:2};
  if(t.league==='KR'&&t.div<3&&r>n-2)return {text:`잔류 (${n-2}위 이내)`,target:n-2};return {text:`${Math.ceil(n/2)}위 이내 (재건)`,target:Math.ceil(n/2)};}
function ensureCareer(){S.mgr.career=S.mgr.career||[];const ut=userTeam();const last=S.mgr.career[S.mgr.career.length-1];if(!last||last.team!==ut.id)S.mgr.career.push({team:ut.id,name:ut.name,comp:compOf(ut),from:S.season,to:null});}
const REP_TIER={3:0.8,2:1.0,1:1.25,TW:1.0,JP:1.3,MX:1.0,US:1.5};
function repScore(m){let sc=0;if(m.expRank!=null)sc+=(m.expRank-m.rank)*3;else sc+=(m.rank<=2?3:m.rank>=7?-2:0);if(m.rank===1)sc+=6;if(m.promoted)sc+=8;if(m.relegated)sc-=8;
  if(m.goalMet===true)sc+=4;else if(m.goalMet===false)sc-=3;sc+=(m.devHits||0)*4+(m.abroad||0)*2;
  sc+=opsScore(m);
  return sc*(REP_TIER[lgOf(m.div)]||1)*0.5;}
// 운영 점수: 전력 변화 + 흑자 판매 보너스 − 시즌 중 주전 대량 매각(3명째부터) 감점
function opsScore(m){let o=0;if(m.powerStart!=null&&m.powerEnd!=null){const d=m.powerEnd-m.powerStart;o=clamp(d*1.5,-10,6);if(d>=-1.5&&m.salesProfit>0)o+=Math.min(4,m.salesProfit/50000);}o-=Math.max(0,(m.starterSales||0)-2)*2.5;return o;}
function calcRep(){const ms=(S.mgr&&S.mgr.seasons)||[];let sum=0;ms.forEach((m,i)=>{sum+=repScore(m)*Math.pow(0.85,ms.length-1-i);});return Math.round(clamp(25+sum+(S.mgr.loyalty||0),0,100));}

// 시작 시 명문 구단 전력 보강 (난수를 쓰지 않아 기존 시드의 선수 생성은 그대로)

// ---------- 스폰서 · 광고 ----------
// 메인 스폰서(3~4가지 계약 유형 중 선택) + 광고판(고정형/관중 연동형) + 선수 개인 광고(구단 수수료). 유저 구단만 — AI는 기존 자동 수입.

function sponPick(pool,used){const c=pool.filter(x=>!used.has(x[0]));const x=c.length?pick(c):pick(pool);used.add(x[0]);return x;}

    if(kind==='perf')o.bonus=Object.fromEntries(Object.entries(SP.perfBonus).map(([k,v])=>[k,Math.round(B*v/10)*10]));if(kind==='short'){o.target=tgt;o.penalty=Math.round(B*K.miss/10)*10;}if(kind==='big')o.clause='relegate';return o;};

function sponSign(oid){const t=userTeam();ensureSpon(t);const sp=t.spon;if(S.phase!=='offseason')return '스폰서 계약은 스토브리그에만 할 수 있습니다.';if(sp.main)return `이미 ${sp.main.co}와 계약 중입니다 (${sp.main.years}년 남음).`;

function boardDrop(oid){const sp=userTeam().spon;if(S.phase!=='offseason')return '시즌 중에는 뺄 수 없습니다.';const b=sp.boards.find(x=>x.id===oid);if(!b)return '없는 광고입니다.';sp.boards=sp.boards.filter(x=>x.id!==oid);sp.boardOffers.push(b);return null;}

  if(m.kind==='perf'){const b=m.bonus;const now=!played?0:r===1?b.r1:r===2?b.r2:r<=4?b.r4:0;return {text:played?`지금 ${r}위 → 순위 보너스 ${money(now)}${t.league==='KR'&&t.div>1?` (+승격 시 ${money(b.promo)})`:''}`:'개막 전',ok:now>0};}

  if(m.kind==='big')return {text:'강등되면 계약 해지',ok:null};return null;}
function sponSettle(s,rec){const t=userTeam();if(!t.spon)return;const sp=t.spon;const m=sp.main;const L=S.lastSummary||{};const out=[];const n=compTeams(L.div!=null?L.div:compOf(t)).length||8;const r=L.rank||t.lastRank||n;
  const champ=rec.post&&Object.values(rec.post.final||{}).some(f=>f.w===t.id);
  if(m&&m.since<=s){if(m.kind==='perf'){const b=m.bonus;let x=r===1?b.r1:r===2?b.r2:r<=4?b.r4:0;if(L.promoted)x+=b.promo;if(champ)x+=b.champ;if(x){t.cash+=x;t.fin.sponsor+=x;out.push(`${m.co} 성적 보너스 +${money(x)}`);}else out.push(`${m.co} 성적 보너스 없음 (${r}위)`);}

function postGames(){return S.schedule.filter(g=>g.post&&g.day===S.day);}

function postResultCard(rec){const P=rec.post;const ws=x=>x.split(':').map(Number).sort((a,b)=>b-a).join(':');const nm=id=>S.teams[id]?esc(S.teams[id].name):'-';const rows=[];

    h+=`<div class="card">${hd('스카우트 의견')}${SL.scoutReport(p).map(x=>`<div class="small" style="padding:2px 0">· ${esc(x)}</div>`).join('')}${!mine?`<div style="height:8px"></div><button class="ghost" style="width:100%" onclick="UI.compare(${p.id})">우리 팀 ${SL.POS_KO[p.pos]}과 비교</button>`:''}</div>`;

    if(p.transfers.length)h+=`<div class="card">${hd('구단 이동 이력')}${p.transfers.map(x=>`<div class="small" style="padding:3px 0">${x.s}시즌 ${esc(x.from)} → ${esc(x.to)} <span class="muted">(${esc(x.kind)}${x.fee?', '+M(x.fee):''})</span></div>`).join('')}</div>`;
  }else{
    if(p.contract){const urgent=(p.contract.years<=1&&S.phase==='season')||p.contract.years<=0;h+=`<div class="card">${hd('계약')}<div class="stat3" style="margin-bottom:8px"><div><div class="k">연봉</div><div class="v">${Ms(p.contract.salary)}</div></div><div><div class="k">잔여</div><div class="v">${Math.max(0,p.contract.years)}시즌</div></div><div><div class="k">사기</div><div class="v ${p.morale<40?'bad':p.morale>=70?'ok':''}">${p.morale}</div></div></div><div class="${urgent?'due b':''}">${esc(SL.contractText(p))}</div>${p.promise?`<div class="small" style="margin-top:6px"><span class="chip o">주전 출장 약속 중</span> 시즌 14일차에 확인</div>`:''}</div>`;}

    if(p.interest)h+=`<div class="card">${hd('해외 관심')}<div>${esc(SL.interestText(p))}</div></div>`;
    h+=`<div class="card">${hd('무대별 위상','능력치는 같고 상대 수준만 다름')}<div class="tw"><table><tr><th>무대</th><th>수준</th><th>이 선수</th></tr>${SL.standingAll(p).map(x=>`<tr${t&&SL.leagueKey(t)===x.key?' class="me"':''}><td>${esc(x.name)}</td><td>${x.lvl}</td><td><span class="chip ${x.cls}">${x.label}</span></td></tr>`).join('')}</table></div><div class="muted small" style="margin-top:6px">리그 위상은 각 리그 같은 포지션 주전들과의 비교, 구단 내 역할은 그 팀 포지션 경쟁으로 따로 판단합니다.</div></div>`;

      h+=`<div class="card">${hd('관리')}<div class="btns"><button class="primary" onclick="UI.openTable(${p.id})">재계약 협상</button><button class="${listed?'':'warn'}" onclick="UI.${listed?'unlist':'list'}(${p.id})">${listed?'판매 등록 해제':'판매 등록'}</button><button onclick="UI.${inDev?'promote':'demote'}(${p.id})">${inDev?'1군 등록':'육성군으로 이동'}</button>${p.age<=SL.BAL.LOAN.maxAge?`<button onclick="UI.loanView(${p.id})">임대 보내기</button>`:''}<button class="ghost" onclick="UI.confirmRelease(${p.id})">방출</button></div></div>`;}

    else if(p.loan&&p.loan.from===ut.id)h+=`<div class="actbar gut"><span class="small muted" style="align-self:center">우리 구단 임대 선수 · ${p.loan.s}시즌 뒤 복귀</span></div>`;
    else if(!t||t.league)h+=`<div class="actbar gut"><button class="ghost" onclick="UI.pin(${p.id})">${S.pins.includes(p.id)?'고정 해제':'관심 고정'}</button><button class="primary" onclick="UI.openTable(${p.id})">${!t?'계약 협상':'영입 협상'}</button></div>`;}
  return h+`</div>`;

function saleCard(p){const im=SL.saleImpact(p.id);if(!im)return '';const nc=im.newcomers;

function renderTable(v){

  if(stage==='club'){const st=Math.max(100,Math.round(neg.ask*0.05/100)*100);h+=`<label for="tf_fee">이적료 (만원) · 시장가치 ${Ms(SL.calcValue(p))}</label><div class="stepper"><button aria-label="감소" onclick="UI.bump('fee',-${st})">−</button><input id="tf_fee" type="number" value="${f.fee}" onchange="UI.setF('fee',+this.value)"><button aria-label="증가" onclick="UI.bump('fee',${st})">＋</button></div><div style="height:10px"></div><div class="btns"><button class="ghost" onclick="UI.leaveTable()">자리에서 일어나기</button><button class="primary" onclick="UI.tableSubmit()">이적료 제안</button></div>`;}

function advCard(p){const a=SL.advStats(p);if(!a)return '';const f3=x=>x.toFixed(3).replace(/^0/,''),f2=x=>x.toFixed(2),pc=x=>(x*100).toFixed(1)+'%';const P=a.pct||{};const c=a.ctx;

function abilityLink(p,a){const A=k=>Math.round(p.attrs[k]);const pc=x=>(x*100).toFixed(1)+'%',f3=x=>x.toFixed(3).replace(/^0/,'');const c=a.ctx;const vs=(v,l,hi)=>`<span class="${(hi?v>l:v<l)?'up':'dn'}">${hi?(v>l?'▲':'▼'):(v<l?'▼':'▲')}</span>`;

    if(!ours.length){modal(`<h3>${SL.POS_KO[p.pos]} 비교</h3><div>우리 팀에 ${SL.POS_KO[p.pos]}이 없습니다. 영입하면 바로 주전 후보입니다.</div>`);return;}
    const cols=[p,...ours];modal(`<h3>${SL.POS_KO[p.pos]} 비교</h3><div class="tw"><table><tr><th></th>${cols.map((q,i)=>`<th>${i===0?'후보':'우리'}<br>${esc(q.name)}</th>`).join('')}</tr>
    <tr><td>나이</td>${cols.map(q=>`<td>${q.age}</td>`).join('')}</tr><tr><td>종합</td>${cols.map(q=>`<td><b>${Math.round(SL.calcOvr(q))}</b></td>`).join('')}</tr><tr><td>잠재</td>${cols.map(q=>`<td>${SL.potText(q)}</td>`).join('')}</tr>
    ${keys.map(k=>`<tr><td>${SL.ATTR_KO[k]}</td>${cols.map((q,i)=>{const d=i===0?0:Math.round(p.attrs[k]-q.attrs[k]);return `<td>${Math.round(q.attrs[k])}${i===0?'':` <span class="${d>0?'up':d<0?'dn':'muted'} small">${d>0?'후보+'+d:d<0?'우리+'+(-d):'='}</span>`}</td>`;}).join('')}</tr>`).join('')}
    <tr><td>연봉</td>${cols.map(q=>`<td>${q.contract?Ms(q.contract.salary):'-'}</td>`).join('')}</tr><tr><td>가치</td>${cols.map(q=>`<td>${Ms(SL.calcValue(q))}</td>`).join('')}</tr></table></div>`);},
  setLineup(i,pid){const ut=SL.userTeam();if(pid<0){const old=ut.lineup[i];if(old!=null){ut.lineup.splice(i,1);delete ut.pos[old];}}else{const j=ut.lineup.indexOf(pid);if(j>=0&&j!==i){const old=ut.lineup[i];ut.lineup[j]=old;ut.lineup[i]=pid;if(old==null)ut.lineup.splice(j,1);}else if(j<0){const old=ut.lineup[i];if(old!=null){ut.pos[pid]=ut.pos[old];delete ut.pos[old];}else ut.pos[pid]=ut.pos[pid]||SL.P(pid).pos;ut.lineup[i]=pid;}}autosave();render();},
  setPos(pid,pos){SL.userTeam().pos[pid]=pos;autosave();render();},
  moveSlot(i,d){const ut=SL.userTeam();const j=i+d;if(j<0||j>=ut.lineup.length)return;[ut.lineup[i],ut.lineup[j]]=[ut.lineup[j],ut.lineup[i]];autosave();render();},
  setRot(i,pid){const ut=SL.userTeam();if(pid<0){const old=ut.rotation[i];if(old!=null){ut.rotation.splice(i,1);ut.bullpen.push(old);}}else{const old=ut.rotation[i];ut.bullpen=ut.bullpen.filter(x=>x!==pid);const j=ut.rotation.indexOf(pid);if(j>=0)ut.rotation.splice(j,1);if(old!=null&&old!==pid){ut.rotation[ut.rotation.indexOf(old)]=pid;ut.bullpen.push(old);}else ut.rotation.splice(i,0,pid);if(ut.closer===pid)ut.closer=null;}if(ut.rotIdx>=ut.rotation.length)ut.rotIdx=0;autosave();render();},
  setCloser(pid){SL.userTeam().closer=pid<0?null:pid;autosave();render();},
  list(pid){const e=SL.listPlayer(pid);toast(e||'판매 등록했습니다. 관심 구단의 제안을 기다리세요.');autosave();render();},
  unlist(pid){SL.unlistPlayer(pid);toast('등록 해제');autosave();render();},
  confirmRelease(pid){const p=SL.P(pid);modal(`<h3>${esc(p.name)} 방출</h3><div>잔여 계약의 30%(${M(Math.round((p.contract?p.contract.salary*Math.max(1,p.contract.years)*0.3:0)/10)*10)})를 위약금으로 지급합니다. 되돌릴 수 없습니다.</div><div style="height:12px"></div><div class="btns"><button class="danger" onclick="UI.release(${pid})">방출 확정</button><button onclick="UI.closeModal()">취소</button></div>`);},
  release(pid){const e=SL.releasePlayer(pid);toast(e||'방출했습니다.');autosave();closeModal();if(!e)ui.view=ui.stack.pop()||null;render();},
  promote(pid){const e=SL.promoteDev(pid);toast(e||'1군에 등록했습니다.');autosave();render();},
  demote(pid){const e=SL.demoteDev(pid);toast(e||'육성군으로 이동했습니다.');autosave();render();},
  draftPick(pid,dest){const r=SL.draftPick(pid,dest);autosave();render();if(r.ok&&r.pid)draftCeremony(r);else toast(r.msg,3500);},
  draftAutoPick(){SL.draftAuto();toast('자동 지명 완료');autosave();render();},
  draftPass(){const r=SL.draftPick(null);toast(r.msg);autosave();render();},
  scout(){const f={...ui.scoutF};f.maxAge=f.maxAge?+f.maxAge:0;f.maxValue=f.maxValue?+f.maxValue:0;const r=SL.runScout(ui.scoutKind,ui.scoutLvl,f);toast(r.msg,3500);autosave();render();},
  coachYears(y){ui.coachYears=y;ui.keepScroll=true;render();},
  coachMarket(d){ui.coachDept=d;ui.keepScroll=true;render();setTimeout(()=>{const e=$('#coachMarket');if(e)try{e.scrollIntoView({block:'start'});}catch(x){}},30);},
  hireCoach(id){const c0=(S.staffPool||[]).find(c=>c.id===id);const e=SL.hireCoach(id,ui.coachYears||2);if(e)toast(e,3500);else{sfx('cash');if(c0&&c0.alumni)setTimeout(()=>alumniCoachCard(c0),80);else toast('코치를 영입했습니다.');}autosave();ui.keepScroll=true;render();},
  armFire(id){ui.fireArm=id;ui.keepScroll=true;render();},
  fireCoach(id){const e=SL.fireCoach(id);ui.fireArm=null;toast(e||'해임했습니다.');autosave();ui.keepScroll=true;render();},
  renewCoach(id){const e=SL.renewCoach(id,ui.coachYears||2);if(e)toast(e,3500);else{sfx('cash');toast('재계약했습니다.');}autosave();ui.keepScroll=true;render();},
  upgrade(k){const e=SL.upgradeFacility(k);toast(e||'업그레이드 완료');autosave();render();},
  loan(){const e=SL.takeLoan(+$('#loanAmt').value);toast(e||'대출 실행');autosave();render();},
  tutNext(n){ui.tut++;if(ui.tut>=n){SL.state().tutorialDone=true;autosave();}render();},
  tutSkip(){SL.state().tutorialDone=true;autosave();render();},
};
document.addEventListener('click',e=>{const b=e.target&&e.target.closest&&e.target.closest('button');if(b&&!b.disabled)sfx('click',0.25);},true);
// 주소 옵션: ?test=1 테스트 도구 · ?new=1&team=0~7&seed=N 새 게임 바로 시작 (테스터용)
const QS=(()=>{try{return new URLSearchParams(location.search);}catch(e){return new URLSearchParams('');}})();ui.testMode=QS.get('test')==='1';
function qsBoot(){if(QS.get('new')!=='1'||ui._booted)return;ui._booted=true;const seed=+QS.get('seed')||Math.floor(Math.random()*90000)+1000;const team=Math.max(0,Math.min(7,+QS.get('team')||0));SL.newGame(seed,team,{arch:true});SL.state().tutorialDone=QS.get('tut')!=='1';ui.tab='home';autosave();}
let lastWide=null;window.addEventListener('load',()=>{lastWide=isWide();qsBoot();render();Store.get().then(j=>{if(j&&!Store.has){Store.has=true;if(!SL.state())render();}});});window.addEventListener('resize',()=>{const w=isWide();if(w!==lastWide){lastWide=w;render();}});
return A;
})();

window.UI=UI;
</script>
